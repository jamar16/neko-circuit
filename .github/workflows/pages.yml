# Publishes media/ (post cards and reels) to GitHub Pages so Metricool and the
# Meta API can fetch them by public URL. Only media/ is published, never the app code.
name: Publish media
on:
  push:
    branches: [main]
    paths: ['media/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: media
      - id: deployment
        uses: actions/deploy-pages@v4
